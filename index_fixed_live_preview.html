<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf1f7">
<meta name="color-scheme" content="light">
<meta name="description" content="SIGN WELL · 欣緯 — 卜卦、HTML 預覽、抽籤三合一工具集。">
<title>SIGN WELL · 欣緯</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='%23e9f0f6'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='%232a3446' font-family='sans-serif' font-weight='700'>欣</text></svg>">
<style>
/* =========================================================
   0 · Tokens
   ========================================================= */
:root{
  --bg1:#f9fcfe;
  --bg2:#eaf1f8;
  --bg3:#e3ecf4;

  --ink:#26313f;
  --ink-2:#3b485c;
  --muted:#7f8b9a;

  --rim:rgba(255,255,255,.92);
  --rim-soft:rgba(255,255,255,.62);

  /* Chromatic dispersion used on every glass rim */
  --disp-a:rgba(140,196,255,.55);
  --disp-b:rgba(255,176,214,.42);
  --disp-c:rgba(150,240,220,.40);

  --panel-shadow:
    0 34px 90px rgba(50,72,96,.13),
    0 10px 28px rgba(50,72,96,.07);

  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-soft:cubic-bezier(.22,1,.36,1);

  /* Pointer-tracked specular origin (per element, see .tool/.glass-panel) */
  --mx:50%;
  --my:30%;
  --glow:0;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(155deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

/* =========================================================
   1 · Ambient field
   Coloured orbs drift behind the glass. Without something
   coloured back here, refraction has nothing to bend and the
   panel just reads as a grey box.
   ========================================================= */
.field{
  position:fixed;
  inset:-20%;
  z-index:0;
  pointer-events:none;
  filter:blur(60px) saturate(150%);
  opacity:.85;
}
.orb{
  position:absolute;
  border-radius:50%;
  mix-blend-mode:normal;
  will-change:transform;
}
.orb.a{
  width:46vmax;height:46vmax;left:2%;top:4%;
  background:radial-gradient(circle at 40% 40%,rgba(151,205,255,.72),rgba(151,205,255,0) 68%);
  animation:drift-a 26s ease-in-out infinite alternate;
}
.orb.b{
  width:40vmax;height:40vmax;right:0%;top:16%;
  background:radial-gradient(circle at 55% 45%,rgba(255,186,220,.52),rgba(255,186,220,0) 68%);
  animation:drift-b 31s ease-in-out infinite alternate;
}
.orb.c{
  width:52vmax;height:52vmax;left:18%;bottom:-14%;
  background:radial-gradient(circle at 50% 50%,rgba(150,238,219,.50),rgba(150,238,219,0) 68%);
  animation:drift-c 35s ease-in-out infinite alternate;
}
.orb.d{
  width:30vmax;height:30vmax;right:14%;bottom:2%;
  background:radial-gradient(circle at 50% 50%,rgba(198,180,255,.44),rgba(198,180,255,0) 68%);
  animation:drift-d 29s ease-in-out infinite alternate;
}
@keyframes drift-a{from{transform:translate3d(-6%,-4%,0) scale(1)}to{transform:translate3d(8%,7%,0) scale(1.14)}}
@keyframes drift-b{from{transform:translate3d(5%,3%,0) scale(1.08)}to{transform:translate3d(-7%,-6%,0) scale(.94)}}
@keyframes drift-c{from{transform:translate3d(4%,5%,0) scale(.96)}to{transform:translate3d(-8%,-6%,0) scale(1.16)}}
@keyframes drift-d{from{transform:translate3d(-4%,4%,0) scale(1.1)}to{transform:translate3d(6%,-5%,0) scale(.92)}}

/* Fine grain gives the glass a real material surface. */
.grain{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  opacity:.30;
  background-image:radial-gradient(rgba(70,92,116,.13) .55px,transparent .75px);
  background-size:21px 21px;
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 76%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 76%);
}

/* =========================================================
   2 · Layout
   ========================================================= */
main{
  position:relative;
  z-index:2;
  height:100dvh;
  display:grid;
  justify-items:center;
  align-content:safe center;
  padding:
    max(24px,env(safe-area-inset-top))
    max(18px,env(safe-area-inset-right))
    max(30px,env(safe-area-inset-bottom))
    max(18px,env(safe-area-inset-left));
  transition:opacity .5s ease,filter .5s ease;
  overflow-y:auto;
  overscroll-behavior:contain;
}

.home{
  width:min(940px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

h1{
  margin:0;
  max-width:820px;
  font-size:clamp(32px,5.8vw,62px);
  line-height:1.1;
  letter-spacing:-.055em;
  font-weight:730;
  text-wrap:balance;
  color:#26313f;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}

.sub{
  margin:14px 0 0;
  color:var(--muted);
  font-size:clamp(13px,1.6vw,15.5px);
  line-height:1.7;
}

/* =========================================================
   3 · Liquid glass panel
   Float lives on .panel-shell using the independent `translate`
   property; tilt lives on .glass-panel using `transform`. They
   never overwrite each other, which is what let the old build
   silently drop its press + reveal transforms.
   ========================================================= */
.panel-shell{
  width:min(740px,100%);
  margin-top:clamp(26px,4vh,40px);
  perspective:1400px;
  will-change:translate;
}
@keyframes shellFloat{
  from{translate:0 0}
  to{translate:0 -7px}
}

.glass-panel{
  --rx:0deg;
  --ry:0deg;
  position:relative;
  padding:20px;
  border-radius:38px;
  isolation:isolate;
  border:1px solid var(--rim);
  background:
    radial-gradient(340px circle at var(--mx) var(--my),
      rgba(255,255,255,calc(.16 + var(--glow) * .34)),transparent 62%),
    linear-gradient(150deg,rgba(255,255,255,.42),rgba(236,246,253,.24));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.94),
    inset 0 -1px 0 rgba(96,124,148,.06),
    var(--panel-shadow);
  backdrop-filter:blur(26px) saturate(178%) brightness(1.04);
  -webkit-backdrop-filter:blur(26px) saturate(178%) brightness(1.04);
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transform-style:preserve-3d;
  transition:box-shadow .3s ease,border-color .3s ease;
}

/* Refraction layer: a displaced copy of the backdrop that only
   shows near the rim, where real glass bends light hardest. */
.glass-panel .refract{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:0;
  backdrop-filter:blur(6px) url(#liquidWarp) saturate(150%);
  mask:
    linear-gradient(#000,#000) content-box,
    linear-gradient(#000,#000);
  -webkit-mask:
    linear-gradient(#000,#000) content-box,
    linear-gradient(#000,#000);
  mask-composite:exclude;
  -webkit-mask-composite:xor;
  padding:16px;
}

/* Chromatic dispersion rim — the fringe that sells "glass". */
.glass-panel .rim{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:4;
  padding:1.4px;
  background:
    linear-gradient(135deg,
      var(--disp-a) 0%,
      rgba(255,255,255,.95) 18%,
      var(--disp-c) 34%,
      rgba(255,255,255,.30) 52%,
      var(--disp-b) 72%,
      rgba(255,255,255,.92) 88%,
      var(--disp-a) 100%);
  mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  mask-composite:exclude;
  -webkit-mask-composite:xor;
  opacity:.72;
  mix-blend-mode:plus-lighter;
}

/* Travelling sheen. */
.glass-panel .sheen{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:3;
  overflow:hidden;
}
.glass-panel .sheen::before{
  content:"";
  position:absolute;
  top:-60%;
  left:-40%;
  width:38%;
  height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.50),transparent);
  transform:rotate(14deg);
  filter:blur(9px);
  animation:sheenSweep 8.5s var(--ease-soft) infinite;
}
@keyframes sheenSweep{
  0%,62%{transform:translateX(-40%) rotate(14deg);opacity:0}
  70%{opacity:.9}
  100%{transform:translateX(420%) rotate(14deg);opacity:0}
}

/* Soft caustic pooling inside the glass. */
.panel-aura{
  position:absolute;
  inset:-8% -5%;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 32%,rgba(178,214,246,.34),transparent 24%),
    radial-gradient(circle at 76% 62%,rgba(186,236,222,.26),transparent 25%),
    radial-gradient(circle at 60% 14%,rgba(224,206,246,.22),transparent 22%);
  filter:blur(20px);
  opacity:.8;
  animation:auraDrift 15s ease-in-out infinite alternate;
}
@keyframes auraDrift{
  from{translate:-1.4% -.6%;scale:1}
  to{translate:1.4% 1%;scale:1.05}
}

.panel-grid{
  position:relative;
  z-index:5;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}

/* =========================================================
   4 · Crystal buttons
   --mx/--my are re-declared here so they can't inherit the
   parent panel's pointer coordinates, which used to drag every
   button's highlight to the wrong place.
   ========================================================= */
.tool{
  --mx:50%;
  --my:34%;
  --glow:0;
  --tx:0px;
  --ty:0px;
  --press:1;
  position:relative;
  min-height:92px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.66);
  border-radius:26px;
  appearance:none;
  isolation:isolate;
  background:
    radial-gradient(190px circle at var(--mx) var(--my),
      rgba(255,255,255,calc(.24 + var(--glow) * .34)),
      rgba(255,255,255,.06) 46%,
      transparent 70%),
    linear-gradient(148deg,rgba(255,255,255,.17),rgba(255,255,255,.055));
  color:var(--ink-2);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font:700 16px/1.35 inherit;
  letter-spacing:-.02em;
  cursor:pointer;
  overflow:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.90),
    inset 0 -1px 0 rgba(103,131,153,.09),
    inset 12px 0 26px -24px rgba(255,255,255,.82),
    inset -12px 0 26px -24px rgba(88,115,138,.22),
    0 12px 26px rgba(56,76,96,.06);
  backdrop-filter:blur(5px) saturate(132%) brightness(1.03);
  -webkit-backdrop-filter:blur(5px) saturate(132%) brightness(1.03);
  animation:btnFloat 6.4s ease-in-out var(--delay,0s) infinite alternate;
  transform:scale(var(--press));
  transition:
    border-color .24s ease,
    box-shadow .24s ease,
    transform .22s var(--ease-out),
    background .2s linear;
  will-change:translate,transform;
}
@keyframes btnFloat{
  from{translate:0 0}
  to{translate:var(--tx) var(--ty)}
}
.tool.t1{--tx:2px;--ty:-3px}
.tool.t2{--tx:-2px;--ty:-4px}
.tool.t3{--tx:2px;--ty:3px}

/* Top-edge crystal highlight. */
.tool::before{
  content:"";
  position:absolute;
  left:8%;right:8%;top:1px;
  height:40%;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.04),transparent);
  opacity:.7;
  pointer-events:none;
  z-index:1;
}
/* Chromatic rim per button. */
.tool::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  z-index:3;
  padding:1.1px;
  background:linear-gradient(140deg,
    var(--disp-a),rgba(255,255,255,.9) 24%,
    var(--disp-c) 46%,rgba(255,255,255,.24) 62%,
    var(--disp-b) 82%,rgba(255,255,255,.86));
  mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  mask-composite:exclude;
  -webkit-mask-composite:xor;
  opacity:.55;
  mix-blend-mode:plus-lighter;
  transition:opacity .24s ease;
}

.tool span{
  position:relative;
  z-index:4;
  width:100%;
  display:block;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}

/* Liquid press ripple. */
.tool .ripple{
  position:absolute;
  z-index:2;
  width:12px;height:12px;
  margin:-6px 0 0 -6px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.85),rgba(190,225,255,.35) 46%,transparent 70%);
  animation:ripple .62s var(--ease-out) forwards;
}
@keyframes ripple{
  from{scale:1;opacity:.9}
  to{scale:26;opacity:0}
}

.tool:hover{
  animation-play-state:paused;
  border-color:rgba(255,255,255,.86);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.97),
    inset 0 -1px 0 rgba(92,121,145,.09),
    0 18px 38px rgba(56,76,96,.09);
}
.tool:hover::after{opacity:.85}
.tool:active{--press:.972}
.tool:focus-visible{
  outline:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.97),
    0 0 0 3px rgba(120,175,235,.55),
    0 18px 38px rgba(56,76,96,.09);
}

.hint{
  margin-top:18px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#95a0ae;
  font-size:11.5px;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:#7d8da1;
  box-shadow:0 0 0 5px rgba(125,141,161,.09);
  animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{50%{scale:1.18;opacity:.75}}

/* =========================================================
   5 · Hero typing
   ========================================================= */
.typing-title{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.08em;
  min-height:2.3em;
}
.typing-line{display:block;min-height:1.1em;white-space:nowrap}
.typing-line.typing::after{
  content:"";
  display:inline-block;
  width:.055em;height:.86em;
  margin-left:.1em;
  vertical-align:-.05em;
  border-radius:999px;
  background:currentColor;
  opacity:.72;
  animation:caret .78s steps(1,end) infinite;
}
@keyframes caret{0%,48%{opacity:.72}49%,100%{opacity:0}}

.home.typing-start .panel-shell{opacity:0;translate:0 20px;filter:blur(11px)}
.home.typing-done  .panel-shell{opacity:1;translate:0 0;filter:blur(0)}
.panel-shell{
  transition:
    opacity .9s var(--ease-out),
    translate .9s var(--ease-out),
    filter .9s var(--ease-out);
}
.home.typing-done .panel-shell{animation:shellFloat 9.5s ease-in-out 1s infinite alternate}

.home.typing-start .tool{opacity:0;filter:blur(8px)}
.home.typing-done  .tool{
  opacity:1;filter:blur(0);
  transition:
    opacity .75s var(--ease-out),
    filter .75s var(--ease-out),
    border-color .24s ease,
    box-shadow .24s ease,
    transform .22s var(--ease-out),
    background .2s linear;
}
.home.typing-done .tool:nth-child(1){transition-delay:.12s}
.home.typing-done .tool:nth-child(2){transition-delay:.2s}
.home.typing-done .tool:nth-child(3){transition-delay:.28s}

.home.typing-start .sub,
.home.typing-start .hint{opacity:0;translate:0 8px;filter:blur(5px)}
.home.typing-done .sub,
.home.typing-done .hint{opacity:1;translate:0 0;filter:blur(0)}
.sub,.hint{
  transition:
    opacity .75s var(--ease-out),
    translate .75s var(--ease-out),
    filter .75s var(--ease-out);
}

/* =========================================================
   6 · Splash
   ========================================================= */
#signwellSplash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:linear-gradient(155deg,#fafcfe 0%,#eef4f9 48%,#e6eef6 100%);
  transition:
    opacity .66s cubic-bezier(.4,0,.2,1),
    filter .66s cubic-bezier(.4,0,.2,1),
    visibility 0s linear .66s;
}
#signwellSplash .field{position:absolute;opacity:.7}
#signwellSplash.is-out{
  opacity:0;
  filter:blur(8px);
  visibility:hidden;
  pointer-events:none;
}
.splash-word{
  position:relative;
  z-index:2;
  min-width:min(86vw,700px);
  padding:0 20px;
  text-align:center;
  color:#25324a;
  font-size:clamp(46px,9.2vw,108px);
  font-weight:730;
  line-height:1;
  letter-spacing:-.055em;
  opacity:0;
  translate:0 14px;
  scale:.84;
  filter:blur(12px);
  will-change:translate,scale,opacity,filter;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}
.splash-word.en{letter-spacing:-.04em;font-size:clamp(41px,8.2vw,98px)}
.splash-word.in{animation:wordIn .56s var(--ease-soft) forwards}
.splash-word.out{animation:wordOut .3s cubic-bezier(.4,0,1,1) forwards}
@keyframes wordIn{
  0%{opacity:0;translate:0 14px;scale:.84;filter:blur(12px)}
  58%{opacity:1;translate:0 0;scale:1.035;filter:blur(0)}
  100%{opacity:1;translate:0 0;scale:1;filter:blur(0)}
}
@keyframes wordOut{
  from{opacity:1;translate:0 0;scale:1;filter:blur(0)}
  to{opacity:0;translate:0 -10px;scale:1.1;filter:blur(8px)}
}
.splash-dots{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:max(11%,calc(env(safe-area-inset-bottom) + 34px));
  translate:-50% 0;
  display:flex;
  gap:7px;
}
.splash-dots i{
  width:6px;height:6px;
  border-radius:50%;
  background:rgba(60,76,94,.16);
  transition:scale .24s ease,background .24s ease;
}
.splash-dots i.active{background:rgba(50,65,84,.6);scale:1.28}

body.splash-locked{overflow:hidden}
body.splash-locked main{opacity:0}

/* =========================================================
   7 · Tool host
   ========================================================= */
#siteHost{
  position:fixed;
  inset:0;
  z-index:10000;
  visibility:hidden;
  opacity:0;
  background:#fff;
  transition:opacity .34s var(--ease-out),visibility 0s linear .34s;
}
#siteHost.show{visibility:visible;opacity:1;transition-delay:0s}
#siteHost iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  opacity:0;
  transition:opacity .4s ease;
}
#siteHost.ready iframe{opacity:1}

/* Glass loading veil while the tool boots. */
.host-veil{
  position:absolute;
  inset:0;
  z-index:1;
  display:grid;
  place-items:center;
  background:linear-gradient(155deg,#f9fcfe,#e9f1f8);
  transition:opacity .4s ease,visibility 0s linear .4s;
}
#siteHost.ready .host-veil{opacity:0;visibility:hidden}
.host-veil .spinner{
  width:34px;height:34px;
  border-radius:50%;
  border:2.5px solid rgba(90,120,150,.16);
  border-top-color:rgba(70,105,140,.62);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{rotate:360deg}}

.site-host-back{
  position:absolute;
  z-index:2;
  top:max(14px,calc(env(safe-area-inset-top) + 6px));
  left:max(14px,calc(env(safe-area-inset-left) + 6px));
  width:44px;height:44px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:999px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(70% 70% at 30% 22%,rgba(255,255,255,.72),rgba(255,255,255,.34));
  color:#25344a;
  cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 10px 26px rgba(35,50,66,.16);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  transition:transform .2s var(--ease-out),box-shadow .2s ease;
}
.site-host-back svg{width:19px;height:19px}
.site-host-back:hover{transform:scale(1.06)}
.site-host-back:active{transform:scale(.93)}
.site-host-back:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px rgba(120,175,235,.6),0 10px 26px rgba(35,50,66,.16);
}

/* Transition veil between home and tool. */
.exit-layer{
  position:fixed;
  inset:0;
  z-index:9000;
  pointer-events:none;
  opacity:0;
  background:rgba(240,246,251,.62);
  backdrop-filter:blur(10px) saturate(140%);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
  transition:opacity .22s ease;
}
body.leaving .exit-layer{opacity:1}
body.leaving main{filter:blur(3px);opacity:.55}

body.site-open main{pointer-events:none}
body.site-open .field .orb,
body.site-open main .tool,
body.site-open main .panel-shell,
body.site-open main .panel-aura,
body.site-open main .sheen::before{animation-play-state:paused!important}

/* =========================================================
   8 · Responsive
   ========================================================= */
@media(max-width:860px){
  .panel-shell{width:min(520px,100%)}
  .glass-panel{padding:15px;border-radius:32px}
  .panel-grid{grid-template-columns:1fr;gap:10px}
  .tool{min-height:78px;border-radius:22px;font-size:15.5px}
  .glass-panel{
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
  }
  .tool{
    backdrop-filter:blur(4px) saturate(126%);
    -webkit-backdrop-filter:blur(4px) saturate(126%);
  }
  .field{filter:blur(48px) saturate(146%)}
}
@media(max-width:420px){
  main{padding-left:16px;padding-right:16px}
  h1{font-size:31px}
  .sub{font-size:12.8px}
  .typing-line{white-space:normal}
}
@media(max-height:600px) and (orientation:landscape){
  .panel-shell{margin-top:18px}
  .tool{min-height:62px}
  h1{font-size:clamp(24px,4vw,34px)}
}

/* =========================================================
   9 · Accessibility fallbacks
   ========================================================= */
@media(prefers-reduced-motion:reduce){
  .orb,.panel-aura,.panel-shell,.tool,.dot,
  .sheen::before,.splash-word.in,.splash-word.out,
  .host-veil .spinner{
    animation:none!important;
  }
  .home.typing-start .panel-shell,
  .home.typing-start .tool,
  .home.typing-start .sub,
  .home.typing-start .hint{
    opacity:1!important;
    translate:0 0!important;
    filter:none!important;
  }
  .typing-line.typing::after{animation:none!important}
  *{scroll-behavior:auto!important}
}

/* Some users disable transparency at the OS level. Honour it —
   glass that can't be seen through should become a solid card,
   not a muddy blur. */
@media(prefers-reduced-transparency:reduce){
  .glass-panel,.tool,.site-host-back{
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
    background:rgba(255,255,255,.94)!important;
  }
  .glass-panel .refract,.field{display:none}
}
</style>

<script>
/* =========================================================
   Shared helpers
   ========================================================= */
const SW = (() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer  = matchMedia('(pointer:fine)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  return { reduceMotion, finePointer, sleep, clamp };
})();
</script>

<script>
/* =========================================================
   1 · Splash
   Dots are generated from the sequence so the two can never
   drift out of sync when the sequence is edited.
   ========================================================= */
(() => {
  const splash = document.getElementById('signwellSplash');
  const word   = document.getElementById('splashWord');
  const dotBox = document.getElementById('splashDots');
  const { reduceMotion, sleep } = SW;

  const done = () => window.dispatchEvent(new Event('signwell:splash-complete'));

  if(!splash || !word){
    document.body.classList.remove('splash-locked');
    done();
    return;
  }

  const sequence = [
    { text:'欣緯',      cls:'' },
    { text:'SIGN WELL', cls:'en' }
  ];

  if(dotBox){
    dotBox.innerHTML = sequence.map((_, i) =>
      `<i${i === 0 ? ' class="active"' : ''}></i>`).join('');
  }
  const dots = dotBox ? [...dotBox.children] : [];

  const setDot = i => dots.forEach((d, n) => d.classList.toggle('active', n === i));

  async function showStep(step, index){
    word.className = 'splash-word' + (step.cls ? ' ' + step.cls : '');
    word.textContent = step.text;
    setDot(index);
    void word.offsetWidth;            // restart the animation cleanly
    word.classList.add('in');
    await sleep(400);
    word.classList.remove('in');
    word.classList.add('out');
    await sleep(230);
  }

  let finished = false;
  async function finish(){
    if(finished) return;
    finished = true;
    splash.classList.add('is-out');
    document.body.classList.remove('splash-locked');
    await sleep(reduceMotion ? 160 : 680);
    splash.remove();
    done();
  }

  async function run(){
    if(reduceMotion){
      word.textContent = 'SIGN WELL';
      word.style.cssText = 'opacity:1;translate:0 0;scale:1;filter:none';
      await sleep(420);
      return finish();
    }
    await sleep(120);
    for(let i = 0; i < sequence.length; i++) await showStep(sequence[i], i);
    await finish();
  }

  // Failsafe: the page must never stay covered, even if a step throws.
  const failsafe = setTimeout(finish, 4200);
  run().catch(finish).finally(() => clearTimeout(failsafe));
})();
</script>

<script>
/* =========================================================
   2 · Hero typing
   ========================================================= */
(() => {
  const line1 = document.getElementById('typingLine1');
  const line2 = document.getElementById('typingLine2');
  const home  = document.getElementById('homeHero');
  const { reduceMotion, sleep } = SW;
  if(!line1 || !line2 || !home) return;

  const first  = '我是欣緯';
  const second = '有什麼能幫助你的';

  async function typeInto(el, text, speed){
    el.classList.add('typing');
    for(const ch of [...text]){
      el.textContent += ch;
      await sleep(speed + Math.random() * 16);
    }
    await sleep(105);
    el.classList.remove('typing');
  }

  let started = false;
  async function runTyping(){
    if(started) return;
    started = true;

    if(reduceMotion){
      line1.textContent = first;
      line2.textContent = second;
      home.classList.replace('typing-start', 'typing-done');
      return;
    }

    await sleep(150);
    await typeInto(line1, first, 62);
    await sleep(90);
    await typeInto(line2, second, 50);
    line2.classList.add('typing');
    await sleep(260);
    line2.classList.remove('typing');

    home.classList.replace('typing-start', 'typing-done');
  }

  window.addEventListener('signwell:splash-complete', runTyping, { once:true });
  // Second failsafe: if the splash event is somehow missed, still reveal.
  setTimeout(runTyping, 6000);
})();
</script>

<script>
(() => {
'use strict';

const { finePointer, reduceMotion, clamp } = SW;

const panel   = document.getElementById('glassPanel');
const tools   = [...document.querySelectorAll('.tool')];
const host    = document.getElementById('siteHost');
let   frame   = document.getElementById('siteHostFrame');
const backBtn = document.getElementById('siteHostBack');

/* =========================================================
   3 · Liquid glass engine

   Two fixes over the previous build:
   • getBoundingClientRect is read once per pointer session and
     on resize, not on every pointermove — the old version
     forced a layout on every single move event.
   • The rAF loop parks itself once the tilt has settled and is
     woken by input, so an idle tab stops burning frames.
   ========================================================= */

const rectCache = new WeakMap();
function rectOf(el){
  let r = rectCache.get(el);
  if(!r){ r = el.getBoundingClientRect(); rectCache.set(el, r); }
  return r;
}
const dropRects = () => { for(const el of [panel, ...tools]) rectCache.delete(el); };

addEventListener('resize', dropRects, { passive:true });
addEventListener('scroll', dropRects, { passive:true });

function trackPointer(el, e){
  const r = rectOf(el);
  if(!r.width || !r.height) return;
  el.style.setProperty('--mx', clamp(((e.clientX - r.left) / r.width) * 100, -20, 120) + '%');
  el.style.setProperty('--my', clamp(((e.clientY - r.top) / r.height) * 100, -20, 120) + '%');
  el.style.setProperty('--glow', '1');
}
function releasePointer(el, mx, my){
  el.style.setProperty('--mx', mx);
  el.style.setProperty('--my', my);
  el.style.setProperty('--glow', '0');
}

let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;
let rafId = null;

function tiltFrame(){
  curRX += (targetRX - curRX) * .08;
  curRY += (targetRY - curRY) * .08;

  const settled =
    Math.abs(targetRX - curRX) < .003 &&
    Math.abs(targetRY - curRY) < .003;

  if(settled){ curRX = targetRX; curRY = targetRY; }

  if(panel){
    panel.style.setProperty('--rx', curRX.toFixed(3) + 'deg');
    panel.style.setProperty('--ry', curRY.toFixed(3) + 'deg');
  }

  if(settled){ rafId = null; return; }   // park the loop
  rafId = requestAnimationFrame(tiltFrame);
}
function wakeTilt(){
  if(rafId === null && !document.hidden) rafId = requestAnimationFrame(tiltFrame);
}
function setTilt(rx, ry){
  if(reduceMotion) return;
  targetRX = rx; targetRY = ry;
  wakeTilt();
}

document.addEventListener('visibilitychange', () => {
  if(document.hidden && rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
  else wakeTilt();
});

if(panel){
  panel.addEventListener('pointerenter', () => dropRects(), { passive:true });
  panel.addEventListener('pointermove', e => {
    trackPointer(panel, e);
    if(!finePointer) return;
    const r = rectOf(panel);
    if(!r.width) return;
    setTilt(
      -((e.clientY - r.top) / r.height - .5) * 3.2,
       ((e.clientX - r.left) / r.width  - .5) * 4.4
    );
  }, { passive:true });

  panel.addEventListener('pointerleave', () => {
    releasePointer(panel, '50%', '30%');
    setTilt(0, 0);
  }, { passive:true });
}

/* Phones have no cursor, so the tilt is driven by how the device
   is actually held. Only bound after the user grants motion access
   where the platform requires it, and silently skipped otherwise. */
if(!finePointer && !reduceMotion && window.DeviceOrientationEvent){
  const needsPermission = typeof DeviceOrientationEvent.requestPermission === 'function';
  const bind = () => addEventListener('deviceorientation', e => {
    if(e.beta === null || e.gamma === null) return;
    setTilt(clamp((e.beta - 45) * .05, -3, 3), clamp(e.gamma * .06, -4, 4));
  }, { passive:true });

  if(needsPermission){
    document.addEventListener('pointerdown', function ask(){
      document.removeEventListener('pointerdown', ask);
      DeviceOrientationEvent.requestPermission().then(s => { if(s === 'granted') bind(); }).catch(() => {});
    }, { once:true });
  }else{
    bind();
  }
}

/* Per-button highlight + press ripple. */
tools.forEach(btn => {
  btn.addEventListener('pointerenter', () => rectCache.delete(btn), { passive:true });
  btn.addEventListener('pointermove',  e => trackPointer(btn, e),   { passive:true });
  btn.addEventListener('pointerleave', () => releasePointer(btn, '50%', '34%'), { passive:true });

  btn.addEventListener('pointerdown', e => {
    if(reduceMotion) return;
    const r = rectOf(btn);
    if(!r.width) return;
    const drop = document.createElement('span');
    drop.className = 'ripple';
    drop.style.left = (e.clientX - r.left) + 'px';
    drop.style.top  = (e.clientY - r.top)  + 'px';
    btn.appendChild(drop);
    drop.addEventListener('animationend', () => drop.remove(), { once:true });
  }, { passive:true });
});

/* =========================================================
   4 · Tool host

   The embedded sites are decoded once and cached, so a second
   visit is instant instead of re-decoding ~400 KB of base64 on
   the main thread every time.
   ========================================================= */

const decoded = new Map();

function decodeSite(key){
  if(decoded.has(key)) return decoded.get(key);
  const b64 = embeddedSites[key];
  if(!b64) return null;
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const html = new TextDecoder('utf-8').decode(bytes);
  decoded.set(key, html);
  return html;
}

let currentSite = null;
let lastFocus   = null;
let openTimer   = null;
let historyDepth = 0;

function setHostVisible(visible){
  host.classList.toggle('show', visible);
  host.setAttribute('aria-hidden', visible ? 'false' : 'true');
  document.body.classList.toggle('site-open', visible);
  document.body.classList.remove('leaving');
  if(!visible) host.classList.remove('ready');
}

/* Esc has to work while focus lives inside the iframe too. The
   srcdoc document is same-origin, so we can listen directly; if a
   future build sandboxes it, the try/catch keeps this harmless. */
function wireFrame(){
  host.classList.add('ready');
  try{
    const doc = frame.contentDocument;
    if(doc) doc.addEventListener('keydown', onEscape);
  }catch(_){ /* cross-origin: nothing to wire */ }
}

function onEscape(e){
  if(e.key === 'Escape' && currentSite) closeSite();
}

function openSite(key){
  const source = decodeSite(key);
  if(!source){
    document.body.classList.remove('leaving');
    return;
  }

  try{
    currentSite = key;
    lastFocus = document.activeElement;

    host.classList.remove('ready');

    // Show the host BEFORE handing over the document. A tool that boots
    // inside an unrendered iframe never gets a requestAnimationFrame, and
    // anything it defers to the first frame never runs.
    setHostVisible(true);
    loadIntoFrame(source);

    backBtn?.focus({ preventScroll:true });

    // Gives the phone's back gesture something to pop, so leaving a
    // tool returns home instead of leaving the page entirely.
    try{
      history.pushState({ sw:key }, '', location.href);
      historyDepth++;
    }catch(_){ /* history unavailable in some sandboxes */ }

  }catch(err){
    currentSite = null;
    clearFrame();
    setHostVisible(false);
    console.warn('[SIGN WELL] tool failed to open:', err);
  }
}

/* =========================================================
   Frame loading

   srcdoc gives the tool an `about:srcdoc` document. The HTML
   preview tool builds its own sandboxed srcdoc iframe for the live
   preview, and a srcdoc nested inside a srcdoc does not load —
   which is exactly why that tool works when opened on its own and
   not from here.

   Writing the document straight into a fresh about:blank iframe
   avoids srcdoc entirely. The tool then runs with the same origin
   and the same kind of document URL it has when opened directly,
   so its nested preview behaves identically. Unlike a blob: URL
   this also works from file://.
   ========================================================= */

let frameLoadTimer = null;

/* Hands the tool a brand new about:blank document every time, so no
   state survives from the previous tool. contentDocument on a freshly
   inserted iframe is available synchronously. */
function freshFrame(){
  const next = document.createElement('iframe');
  next.id = 'siteHostFrame';
  next.title = '工具網站';
  frame.replaceWith(next);
  frame = next;
  return next;
}

function clearFrame(){
  if(frameLoadTimer){ clearTimeout(frameLoadTimer); frameLoadTimer = null; }
  freshFrame();
}

function loadIntoFrame(source){
  if(frameLoadTimer){ clearTimeout(frameLoadTimer); frameLoadTimer = null; }

  const target = freshFrame();
  target.addEventListener('load', wireFrame, { once:true });

  let wrote = false;
  try{
    const doc = target.contentDocument;
    if(doc){
      doc.open();
      doc.write(source);
      doc.close();
      wrote = true;
    }
  }catch(_){ wrote = false; }

  if(!wrote){
    /*
      Some in-app WebViews expose contentDocument but still block document.write.
      Prefer a Blob navigation before falling all the way back to srcdoc, so
      Preview Studio is not itself hosted in srcdoc when avoidable.
    */
    try{
      const blobUrl = URL.createObjectURL(
        new Blob([source], { type:'text/html;charset=utf-8' })
      );
      target.addEventListener('load', () => {
        try{ URL.revokeObjectURL(blobUrl); }catch(_){}
      }, { once:true });
      target.src = blobUrl;
      return;
    }catch(_){}

    target.srcdoc = source;          // final compatibility fallback
    return;
  }

  // document.write() does not reliably fire `load`, so reveal anyway.
  frameLoadTimer = setTimeout(() => { frameLoadTimer = null; wireFrame(); }, 120);
}

function closeSite({ fromHistory = false } = {}){
  if(!currentSite) return;
  currentSite = null;

  clearFrame();
  setHostVisible(false);

  if(!fromHistory && historyDepth > 0){
    historyDepth--;
    try{ history.back(); }catch(_){}
  }

  (lastFocus instanceof HTMLElement ? lastFocus : tools[0])?.focus({ preventScroll:true });
  lastFocus = null;
}

tools.forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.site;
    if(!key || !embeddedSites[key] || currentSite) return;

    document.body.classList.add('leaving');
    if(openTimer) clearTimeout(openTimer);
    openTimer = setTimeout(() => { openTimer = null; openSite(key); }, 160);
  });
});

backBtn?.addEventListener('click', () => closeSite());
window.addEventListener('keydown', onEscape);

window.addEventListener('popstate', () => {
  if(currentSite){
    historyDepth = Math.max(0, historyDepth - 1);
    closeSite({ fromHistory:true });
  }
});

// Restoring from BFCache used to leave a stale overlay on screen.
window.addEventListener('pageshow', e => {
  if(e.persisted){
    currentSite = null;
    clearFrame();
    setHostVisible(false);
  }
});

})();
</script>
</body>
</html>
